name: Android debug verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feat/saarthi-1-release]
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run android:build
        env:
          # An optional HTTPS origin, never a credential. Empty builds fail closed for cloud requests.
          SAARTHI_ANDROID_API_URL: ${{ vars.SAARTHI_ANDROID_API_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saarthi-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
