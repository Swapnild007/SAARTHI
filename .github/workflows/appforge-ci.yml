name: AppForge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/appforge-alpha]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend app.py tests
      - name: Run tests
        run: python -m pytest -q
