name: Release journeys
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/saarthi-1-release]
permissions:
  contents: read
jobs:
  android-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run test:offline && npm run test:e2e && npm run test:a11y && npm run test:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/evidence/*.png
            docs/evidence/*.json
