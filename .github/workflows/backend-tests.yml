name: Recovery regression

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q app.py backend tests scripts
      - run: python -m pytest -q backend tests
      - run: git diff --check HEAD^ HEAD && git rev-parse HEAD
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: node --test tests/database/recovery.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: for entry in scripts/*.js; do node --check "$entry"; done
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
