name: Backend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install audit tooling
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Check JavaScript syntax
        run: |
          node --check scripts/app.js
          node --check scripts/boot.js

      - name: Run tests
        run: python -m pytest -q backend tests
      - name: Smoke test production runtime
        env:
          SAARTHI_RUNTIME_URL: https://saarthi-swapneeldalvi3-1192.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$SAARTHI_RUNTIME_URL/api/health" > /tmp/saarthi-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/saarthi-health.json").read_text())
          assert data.get("ok") is True, data
          PY
          curl --fail --silent --show-error --max-time 60             -H 'Content-Type: text/plain'             --data '{"message":"Hello Saarthi","mode":"chat","assistant":"saarthi","context":{}}'             "$SAARTHI_RUNTIME_URL/api/command/plain" > /tmp/saarthi-command.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/saarthi-command.json").read_text())
          assert data.get("ok") is True, data
          assert isinstance(data.get("reply"), str) and data["reply"].strip(), data
          PY
